<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labview-mcp</title>
<style>
  :root { --bg: #fbfbfa; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #e4e4e2; --link: #2f6fdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --surface: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --border: #2e2e33; --link: #6d9cf0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  li a { color: var(--link); font-weight: 600; text-decoration: none; display: block; }
  li a:hover { text-decoration: underline; }
  li span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>labview-mcp</h1>
  <p>Published pages for <a href="https://github.com/Zuehlke/labview-mcp">Zuehlke/labview-mcp</a>.</p>
  <ul role="list">
<!-- ITEMS -->
  </ul>
</main>
</body>
</html>
