name: pages

# The ONE workflow that deploys GitHub Pages - a Pages deployment replaces the whole site, so a
# second deploying workflow would wipe this one's pages. .github/site/build.py assembles it:
#   /              landing page listing everything below
#   /stats/        daily snapshot of release-asset download counts (and, with a token,
#                  repository traffic), kept as CSV files on the `stats` branch
#   /diagrams/     every docs/diagrams/*.html (architecture and sequence diagrams)
#
# The daily cron and a manual run take a new stats snapshot; a push that changes a diagram or
# the site only republishes, with the stats data the `stats` branch already holds. GitHub keeps
# one PENDING run per concurrency group, so a push queued behind a waiting cron run replaces it
# and that day gets no snapshot. Download counts are cumulative and traffic is re-read for 14 days,
# so this only coarsens the deltas - unless snapshots stop for more than 14 days.
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
#
# Why release assets and not only the traffic API: every plugin install or update fetches
# /releases/latest/download/labview-mcp.zip (.claude-plugin/marketplace.json is an `archive`
# source), so `download_count` on that asset IS the install signal, and GitHub keeps it for
# ever. Views and clones are kept for 14 days only and say nothing about installs - clones are
# mostly our own CI checkouts. .github/stats/collect.py has the reasoning per file.
#
# Our own workflows download the zip too (release.yml's last step, verify-release.yml daily);
# the collector records those runs and the page subtracts them.
#
# One-time setup, both by a repository admin:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Optional, for the traffic chart: a fine-grained PAT scoped to this repository with
#      "Administration: read", stored as the secret STATS_TRAFFIC_TOKEN. GITHUB_TOKEN cannot be
#      granted that permission. Without it the traffic part is skipped and the page says so.

on:
  schedule:
    # After verify-release (06:17) has normally finished; the page attributes CI runs by
    # timestamp between snapshots, so a late cron on either side is harmless.
    - cron: '41 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - '.github/site/**'
      - '.github/stats/site/**'
      - '.github/workflows/pages.yml'

permissions: {}      # granted per job below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # push the snapshot to the stats branch
      actions: read       # list release.yml / verify-release.yml runs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out the stats branch, or start it
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin stats:refs/remotes/origin/stats
            git worktree add -b stats stats-data refs/remotes/origin/stats
          else
            git worktree add --orphan -b stats stats-data
          fi

      - name: Snapshot
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TRAFFIC_TOKEN: ${{ secrets.STATS_TRAFFIC_TOKEN }}
        run: python3 .github/stats/collect.py stats-data/data

      - name: Commit to the stats branch
        if: github.event_name != 'push'
        working-directory: stats-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -q -m "stats: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin stats

      - name: Assemble the site
        run: python3 .github/site/build.py stats-data/data _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
