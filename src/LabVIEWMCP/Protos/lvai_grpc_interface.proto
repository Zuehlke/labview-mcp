//
// Recovered 2026-08-04 from the LIVE LabVIEW 2026 Q3 (x86) gRPC server via
// gRPC server reflection (grpc.reflection.v1alpha.ServerReflection) on
// 127.0.0.1:<dynamic port>.  NOT hand-written and not guessed: this is the
// FileDescriptorProto the server itself serves.
//
// Server component : labview_grpc_server.dll  ==  NI open-source grpc-labview
// Hosted by        : "LV AI gRPC Service.lvlibp" (LVAddons\lvai\26.3)
// Verified         : compiles with protoc; generated stubs return live data
//                    (GetApplicationConfiguration -> language:"English",
//                     ConvertVIToAIXML -> errorCode 0 "No Error" + 3 KB XML)
//
// NOTE: private/undocumented NI interface. No compatibility guarantee.

syntax = "proto3";

package lvai;

option csharp_namespace = "LabVIEWMcp.Lvai";

enum ProjectItemUpdateType {
  PROJECT_ITEM_UPDATE_TYPE_UNSPECIFIED = 0;
  PROJECT_ITEM_UPDATE_TYPE_ADDED = 1;
  PROJECT_ITEM_UPDATE_TYPE_MODIFIED = 2;
  PROJECT_ITEM_UPDATE_TYPE_REMOVED = 3;
}

enum DiscussFileType {
  DISCUSS_FILE_TYPE_UNSPECIFIED = 0;
  DISCUSS_FILE_TYPE_VI = 1;
  DISCUSS_FILE_TYPE_PROJECT = 2;
}

message GetDescribeVIPromptInfoRequest {
  string viPath = 1;
  string viName = 2;
  bool getNodesInfo = 3;
}

message GetDescribeVIPromptInfoResponse {
  string infoJson = 1;
}

message FilterPaletteSearchCandidatesRequest {
  repeated string itemGuids = 1;
}

message PaletteFilterResult {
  string id = 1;
  string description = 2;
  string icon = 3;
  string paletteHierarchy = 4;
  string helpPath = 5;
  string title = 6;
}

message FilterPaletteSearchCandidatesResponse {
  repeated PaletteFilterResult items = 1;
}

message FilterExampleSearchCandidatesRequest {
  repeated string examplePaths = 1;
}

message ExampleFilterResult {
  string path = 1;
  string description = 2;
}

message FilterExampleSearchCandidatesResponse {
  repeated ExampleFilterResult examples = 1;
}

message MonitorDiscussVIRequest {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message MonitorDiscussVIResponse {
  string viPath = 1;
  string viName = 2;
  DiscussFileType fileType = 3;
}

message PaletteResult {
  string itemGuid = 1;
  string rationale = 2;
}

message MonitorPaletteSearchesRequest {
  repeated PaletteResult items = 1;
  int32 errorCode = 2;
  string errorMessage = 3;
  string guid = 4;
}

message MonitorPaletteSearchesResponse {
  string searchString = 1;
  string guid = 2;
}

message ExampleResult {
  string examplePath = 1;
  string rationale = 2;
}

message MonitorExampleSearchesRequest {
  repeated ExampleResult examples = 1;
  int32 errorCode = 2;
  string errorMessage = 3;
  string guid = 4;
}

message MonitorExampleSearchesResponse {
  string searchString = 1;
  string guid = 2;
}

message CodeSuggestion {
  string changes = 1;
  string rationale = 2;
}

message MonitorCodeCompletionRequest {
  string guid = 1;
  repeated CodeSuggestion suggestions = 2;
  int32 remainingRequests = 3;
  int32 maxRequests = 4;
  int32 errorCode = 5;
  string errorMessage = 6;
}

message MonitorCodeCompletionResponse {
  string guid = 1;
  string request = 2;
  bool incomplete = 3;
}

message LogUsageDataRequest {
  string key = 1;
  string value = 2;
}

message LogUsageDataResponse {
}

message GetApplicationConfigurationRequest {
}

message GetApplicationConfigurationResponse {
  string language = 1;
}

message GetDescribeProjectPromptInfoRequest {
  string projectPath = 1;
  string projectName = 2;
}

message GetDescribeProjectPromptInfoResponse {
  string infoJson = 1;
}

message MonitorProjectChangesRequest {
}

message MonitorProjectChangesResponse {
  string projectPath = 1;
  ProjectItemUpdateType updateType = 2;
  string itemName = 3;
  string itemPath = 4;
}

message OpenFileRequest {
  string viPath = 1;
  string viName = 2;
  string projectPath = 3;
  string projectName = 4;
}

message OpenFileResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message FindPaletteItemRequest {
  string guid = 1;
}

message FindPaletteItemResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message DropPaletteItemRequest {
  string guid = 1;
  string viPath = 2;
  string viName = 3;
  string projectPath = 4;
  string projectName = 5;
}

message DropPaletteItemResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message MonitorFrontPanelCleanupRequest {
  string guid = 1;
  string panelInfo = 2;
  int32 errorCode = 3;
  string errorMessage = 4;
}

message MonitorFrontPanelCleanupResponse {
  string guid = 1;
  string request = 2;
  bool incomplete = 3;
}

message ApplyAIXMLToVIRequest {
  string viPath = 1;
  string aiXMLFilePath = 2;
}

message ApplyAIXMLToVIResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message ConvertVIToAIXMLRequest {
  string viPath = 1;
  string aiXMLFilePath = 2;
}

message ConvertVIToAIXMLResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message ConvertAIXMLToVIRequest {
  string aiXMLFilePath = 1;
  string viPath = 2;
  bool openVI = 3;
}

message ConvertAIXMLToVIResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message RunVIAsTopLevelRequest {
  string viPath = 1;
  map<string, string> inputs = 2;
}

message RunVIAsTopLevelResponse {
  map<string, string> outputs = 1;
  int32 errorCode = 2;
  string errorMessage = 3;
}

message ValidateAIXMLRequest {
  string aiXMLFilePath = 1;
}

message ValidateAIXMLResponse {
  int32 errorCode = 1;
  string errorMessage = 2;
}

message BuildFromBuildSpecificationRequest {
  string projectPath = 1;
  string buildSpecificationName = 2;
}

message BuildFromBuildSpecificationResponse {
  repeated string generatedFiles = 1;
  int32 errorCode = 2;
  string errorMessage = 3;
}

message SearchInfoCacheRequest {
  repeated string searchTerms = 1;
  repeated string tagFilters = 2;
  bool caseSensitive = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message InfoCacheResponse {
  string infoJson = 1;
  int32 errorCode = 2;
  string errorMessage = 3;
}

message LookupInfoCacheItemsRequest {
  repeated string guids = 1;
  bool getStandardInfo = 2;
  bool getNodesInfo = 3;
  bool getPrototype = 4;
}

service LVAI {
  rpc GetDescribeVIPromptInfo(GetDescribeVIPromptInfoRequest) returns (stream GetDescribeVIPromptInfoResponse);
  rpc FilterPaletteSearchCandidates(FilterPaletteSearchCandidatesRequest) returns (FilterPaletteSearchCandidatesResponse);
  rpc FilterExampleSearchCandidates(FilterExampleSearchCandidatesRequest) returns (FilterExampleSearchCandidatesResponse);
  rpc MonitorDiscussVI(stream MonitorDiscussVIRequest) returns (stream MonitorDiscussVIResponse);
  rpc MonitorPaletteSearches(stream MonitorPaletteSearchesRequest) returns (stream MonitorPaletteSearchesResponse);
  rpc MonitorExampleSearches(stream MonitorExampleSearchesRequest) returns (stream MonitorExampleSearchesResponse);
  rpc MonitorCodeCompletion(stream MonitorCodeCompletionRequest) returns (stream MonitorCodeCompletionResponse);
  rpc LogUsageData(LogUsageDataRequest) returns (LogUsageDataResponse);
  rpc GetApplicationConfiguration(GetApplicationConfigurationRequest) returns (GetApplicationConfigurationResponse);
  rpc GetDescribeProjectPromptInfo(GetDescribeProjectPromptInfoRequest) returns (stream GetDescribeProjectPromptInfoResponse);
  rpc MonitorProjectChanges(MonitorProjectChangesRequest) returns (stream MonitorProjectChangesResponse);
  rpc OpenFile(OpenFileRequest) returns (OpenFileResponse);
  rpc FindPaletteItem(FindPaletteItemRequest) returns (FindPaletteItemResponse);
  rpc DropPaletteItem(DropPaletteItemRequest) returns (DropPaletteItemResponse);
  rpc MonitorFrontPanelCleanup(stream MonitorFrontPanelCleanupRequest) returns (stream MonitorFrontPanelCleanupResponse);
  rpc ApplyAIXMLToVI(ApplyAIXMLToVIRequest) returns (ApplyAIXMLToVIResponse);
  rpc ConvertAIXMLToVI(ConvertAIXMLToVIRequest) returns (ConvertAIXMLToVIResponse);
  rpc ConvertVIToAIXML(ConvertVIToAIXMLRequest) returns (ConvertVIToAIXMLResponse);
  rpc RunVIAsTopLevel(RunVIAsTopLevelRequest) returns (RunVIAsTopLevelResponse);
  rpc ValidateAIXML(ValidateAIXMLRequest) returns (ValidateAIXMLResponse);
  rpc BuildFromBuildSpecification(BuildFromBuildSpecificationRequest) returns (BuildFromBuildSpecificationResponse);
  rpc SearchInfoCache(SearchInfoCacheRequest) returns (stream InfoCacheResponse);
  rpc LookupInfoCacheItems(LookupInfoCacheItemsRequest) returns (stream InfoCacheResponse);
}

