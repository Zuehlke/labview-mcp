<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>${title}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&amp;family=Caveat:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
@page { size: 1131px 1600px; margin: 0 }
html, body { margin: 0; width: 1131px; height: 1600px; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact }
a { color: #1f1f1e }

.poster { width: 1131px; height: 1600px; box-sizing: border-box; background: #edebe6; color: #1f1f1e; font-family: 'Archivo', system-ui, sans-serif; padding: 72px 80px 64px; display: flex; flex-direction: column; position: relative; overflow: hidden;
  background-image: linear-gradient(rgba(31,31,30,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(31,31,30,0.06) 1px, transparent 1px); background-size: 40px 40px }
.mono { font-family: 'JetBrains Mono', monospace }
.hand { font-family: 'Caveat', cursive; font-weight: 700 }

.topbar { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 3px solid #1f1f1e; padding-bottom: 16px }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 32px }
h1 { margin: 0; font-size: 116px; line-height: 0.92; font-weight: 900; letter-spacing: -0.03em }
.marker { background: linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 90%, transparent 90%) }
.aside { font-size: 38px; line-height: 1; transform: rotate(-6deg); margin-bottom: 24px; text-align: center; white-space: pre-line }

.hero { display: flex; justify-content: center; align-items: center; margin-top: 24px; flex: 1 1 440px; min-height: 440px }
.hero img { height: 440px; width: 440px; object-fit: cover; mix-blend-mode: multiply }

.notes { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 48px; margin: 36px 0 24px; padding: 0 8px }
.note { position: relative; filter: drop-shadow(0 12px 14px rgba(31,31,30,0.16)) drop-shadow(0 2px 2px rgba(31,31,30,0.10)) }
.paper { position: relative; height: 100%; box-sizing: border-box; border-radius: 4px; padding: 40px 34px 30px; display: flex; flex-direction: column; gap: 18px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 52px), calc(100% - 52px) 100%, 0 100%) }
.fold { position: absolute; right: 0; bottom: 0; width: 52px; height: 52px }
.tape { position: absolute; top: -16px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: rgba(255,255,255,0.65); border: 1px solid rgba(31,31,30,0.12) }
.label { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em }
.badge { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center }
.big { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.02em }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { padding: 5px 11px; border-radius: 999px; background: #fff; border: 2px solid var(--accent); font-size: 14px; font-weight: 700 }
.text { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 500 }
.checks { display: flex; flex-direction: column; gap: 16px; margin-top: 4px }
.check { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 800; line-height: 1.05; letter-spacing: -0.01em }
.tick { flex: none; width: 42px; height: 42px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px var(--accent) }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 32px; border-top: 3px solid #1f1f1e; padding-top: 28px }
.cta { font-size: 40px; font-weight: 800; letter-spacing: -0.01em }
.url { font-size: 24px; font-weight: 700; text-decoration: none }
.qr { padding: 14px; background: #fff; border-radius: 16px; box-shadow: 0 14px 30px rgba(31,31,30,0.16), 0 2px 4px rgba(31,31,30,0.10) }
.qr svg { width: 170px; height: 170px; display: block }
</style>
</head>
<body>
<div class="poster" style="--accent: ${accent}; --cols: ${cols}">

<div class="topbar mono"><span>${brand}</span><span>${tagline}</span></div>

<div class="head">
<h1>${headline_top}<br><span class="marker">${headline_marked}</span></h1>
<div class="aside hand">${aside}</div>
</div>

<div class="hero"><img src="${image}" alt="${image_alt}"></div>

<div class="notes">
${notes}
</div>

<div class="foot">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cta">${cta}</div>
<a class="url mono" href="${url}">${url_text}</a>
<div class="hand" style="font-size: 34px; margin-top: 4px">${cta_note}</div>
</div>
<div class="qr">${qr_svg}</div>
</div>

</div>
</body>
</html>
